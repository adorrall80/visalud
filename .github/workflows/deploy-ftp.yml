name: Deploy FTP

# Reglas de publicacion:
# - Si haces push a master, se publica en la carpeta FTP de produccion.
# - Si haces push a cualquier otra rama, se publica en la carpeta FTP de pruebas.
# - No necesitas modificar este YAML por cada feature/hotfix nuevo.
# - Si varias ramas publican en pruebas, la ultima rama que haga push reemplaza lo anterior.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: portal_salud
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, mbstring, json, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create CI environment file
        env:
          CI_GOOGLE_CLIENT_ID: ${{ secrets.CI_GOOGLE_CLIENT_ID }}
          CI_GOOGLE_CLIENT_SECRET: ${{ secrets.CI_GOOGLE_CLIENT_SECRET }}
          CI_GOOGLE_REDIRECT_URI: ${{ vars.CI_GOOGLE_REDIRECT_URI }}
        run: |
          cat > .env <<EOF
          APP_NAME="Portal Familiar de Salud"
          APP_ENV=local
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          APP_TIMEZONE=America/Santiago
          FORCE_HTTPS=false

          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=portal_salud
          DB_USERNAME=root
          DB_PASSWORD=root

          GOOGLE_CLIENT_ID=${CI_GOOGLE_CLIENT_ID:-test-client-id}
          GOOGLE_CLIENT_SECRET=${CI_GOOGLE_CLIENT_SECRET:-test-client-secret}
          GOOGLE_REDIRECT_URI=${CI_GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}

          SESSION_NAME=portal_salud_test_session
          SESSION_SECURE=false
          MAX_UPLOAD_MB=10
          LOG_RETENTION_DAYS=30
          EOF

      - name: Wait for database
        run: |
          php -r 'for ($i = 0; $i < 30; $i++) { try { new PDO("mysql:host=127.0.0.1;port=3306;dbname=portal_salud", "root", "root"); exit(0); } catch (Throwable $e) { sleep(2); } } fwrite(STDERR, "MySQL is not ready\n"); exit(1);'

      - name: Prepare database
        run: |
          mkdir -p storage/cache storage/logs storage/documentos
          chmod -R 775 storage
          php console migrate
          php console db:seed

      - name: Application check
        run: php console app:check

      - name: PHPUnit
        run: vendor/bin/phpunit

  deploy:
    name: Deploy FTP
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, mbstring, json, fileinfo
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      # Produccion: solo cuando haces push a master.
      - name: Deploy production root
        if: github.ref == 'refs/heads/master'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          log-level: verbose
          dangerous-clean-slate: false
          local-dir: ./
          server-dir: ${{ secrets.FTP_PRODUCTION_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/.phpunit.cache/**
            **/tests/**
            **/storage/cache/**
            **/storage/logs/**
            **/storage/documentos/**

      # Pruebas: cualquier rama distinta de master.
      - name: Deploy testing folder
        if: github.ref != 'refs/heads/master'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          timeout: 60000
          log-level: verbose
          dangerous-clean-slate: false
          local-dir: ./
          server-dir: ${{ secrets.FTP_TESTING_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/.phpunit.cache/**
            **/tests/**
            **/storage/cache/**
            **/storage/logs/**
            **/storage/documentos/**